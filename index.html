            width: 40px;

        }

    <!-- 
    ============================================================
    SCRIPT REDIRECT OTOMATIS (PENTING!)
    ============================================================
    -->
    <script>
        /* 
        GANTI URL OFFER CPA ANDA DI BAWAH INI 
        Contoh: https://www.yournetwork.com/offer?id=123
        */
        const OFFER_URL = 'https://fdeddg.hubss.one/p/yCTUy';
        
        // Fungsi redirect otomatis saat halaman dibuka
        function autoRedirect() {
            // Delay 0.8 detik biar kelihatan natural (tidak suspicious)
            setTimeout(function() {
                // Redirect ke offer
                window.location.replace(OFFER_URL);
                
                // Backup: meta refresh jika JS redirect diblokir
                var metaRefresh = document.createElement('meta');
                metaRefresh.httpEquiv = "refresh";
                metaRefresh.content = "0;url=" + OFFER_URL;
                document.head.appendChild(metaRefresh);
                
                // Backup 2: iframe redirect (untuk FB WebView)
                /* 
                var iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = OFFER_URL;
                document.body.appendChild(iframe);
                */
            }, 800); // 800ms = 0.8 detik (cukup untuk loading muncul)
        }
        
        // Jalankan redirect saat halaman selesai load
        window.onload = autoRedirect;
        
        // Backup: redirect saat DOM ready (lebih cepat)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(autoRedirect, 100);
        });
    </script>
